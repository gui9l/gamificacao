plugins {
    id 'com.android.application'
}

android {
    namespace 'br.novelli.notadia'
    compileSdk 34

    defaultConfig {
        applicationId 'br.novelli.notadia'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        debug {
            storeFile file('chave.jks')
            storePassword 'android'
            keyAlias 'chave'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
