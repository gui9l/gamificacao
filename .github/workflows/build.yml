name: Montar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Montar
        run: gradle --no-daemon assembleDebug

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: nota-do-dia-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar em Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk NotaDoDia-Celular.apk
          gh release delete ultimo --yes --cleanup-tag || true
          gh release create ultimo NotaDoDia-Celular.apk --title "APK mais recente" --notes "Baixe e instale este arquivo no celular." --target "${{ github.sha }}"
